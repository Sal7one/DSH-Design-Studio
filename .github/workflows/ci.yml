name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release checks
        run: npm run check
      - name: Smoke tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
