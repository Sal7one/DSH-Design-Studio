name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release checks
        run: npm run check
      - name: Smoke tests
        run: npm test
      - name: Verify tag matches package version
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v' + p.version) { console.error('tag '+tag+' does not match package version '+p.version); process.exit(1) }"
      - name: Choose npm dist-tag
        id: dist
        run: |
          node -e "const p=require('./package.json'); console.log('tag=' + (p.version.includes('-') ? 'next' : 'latest'))" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${{ steps.dist.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
